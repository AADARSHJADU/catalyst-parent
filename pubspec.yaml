name: catalyst
description: "Catalyst Dance Company - Family & Dancer Portal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  intl: ^0.20.2
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  socket_io_client: ^3.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.2.0
  file_picker: ^8.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/app_logo.png
    - assets/images/app_full_logo.jpeg
    - assets/images/dancer_logo.png

  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton/Anton-Regular.ttf
